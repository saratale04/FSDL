
<!--
HOW TO RUN:

1. Save this file as "index.html"
2. Double-click the file OR open in any browser
3. No internet, no server required

PURPOSE:
- CSV data is written directly inside JavaScript
- Parsed manually
- Bar chart generated dynamically
-->

<!DOCTYPE html>
<html>
<head>
    <title>Bar Chart from CSV (Offline)</title>
    <style>
        .chart-container {
            width: 500px;
            margin: 50px auto;
        }

        .bar {
            background-color: purple;
            margin: 10px 0;
            color: white;
            text-align: right;
            padding: 5px;
        }

        .label {
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2 style="text-align:center;">Students by Department (CSV - Offline)</h2>
<div class="chart-container" id="chart"></div>

<script>
    // CSV DATA (hardcoded inside JS)
    // This replaces the need for file reading
    const csvText = `
Department,Students
Computer,120
Mechanical,90
Electrical,70
Civil,60
IT,100
`;

    // Step 1: Convert CSV text into lines
    const lines = csvText.trim().split("\n");

    // Step 2: Remove header row
    lines.shift();

    // Step 3: Convert lines into objects
    const data = lines.map(line => {
        const [dept, students] = line.split(",");
        return {
            dept: dept,
            students: parseInt(students)
        };
    });

    // Step 4: Create bar chart
    const chart = document.getElementById("chart");

    data.forEach(item => {

        // Create department label
        const label = document.createElement("div");
        label.className = "label";
        label.innerText = item.dept;

        // Create bar
        const bar = document.createElement("div");
        bar.className = "bar";

        // Width based on student count
        bar.style.width = item.students * 3 + "px";

        // Show value inside bar
        bar.innerText = item.students;

        // Add to page
        chart.appendChild(label);
        chart.appendChild(bar);
    });
</script>

</body>
</html>
```
