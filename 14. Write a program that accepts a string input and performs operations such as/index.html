<!DOCTYPE html>
<html>
<head>
  <title>String Operations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>🔤 String Operations</h2>

<div class="container">
  <input type="text" id="inputText" placeholder="Enter a string">

  <div class="buttons">
    <button onclick="reverseString()">Reverse</button>
    <button onclick="toUpper()">Uppercase</button>
    <button onclick="toLower()">Lowercase</button>
    <button onclick="getLength()">Length</button>
  </div>

  <h3 id="output"></h3>
</div>

<script src="script.js"></script>

</body>
</html>
