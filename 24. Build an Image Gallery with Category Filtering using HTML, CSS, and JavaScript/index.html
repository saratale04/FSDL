<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h2>Image Gallery</h2>

<!-- Filter Buttons -->
<div class="filters">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('city')">City</button>
    <button onclick="filterImages('animals')">Animals</button>
</div>

<!-- Gallery -->
<div class="gallery">

    <div class="image nature">
        <img src="https://picsum.photos/300?1">
    </div>

    <div class="image city">
        <img src="https://picsum.photos/300?2">
    </div>

    <div class="image animals">
        <img src="https://picsum.photos/300?3">
    </div>

    <div class="image nature">
        <img src="https://picsum.photos/300?4">
    </div>

    <div class="image city">
        <img src="https://picsum.photos/300?5">
    </div>

    <div class="image animals">
        <img src="https://picsum.photos/300?6">
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
