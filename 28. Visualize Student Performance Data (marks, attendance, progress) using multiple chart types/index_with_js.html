
<!--
FILE: student_js_labeled.html

HOW TO RUN:
1. Open in browser
2. No internet required

CHARTS:
- Line Chart → Marks trend
- Bar Chart → Attendance comparison
- Pie Chart → Performance distribution
-->

<!DOCTYPE html>
<html>
<head>
<style>
.container { display:flex; justify-content:space-around; }
.box { text-align:center; }
canvas { border:1px solid #ccc; margin:10px; }
</style>
</head>

<body>
<h2 align="center">Student Performance Dashboard</h2>

<div class="container">

<div class="box">
<h3>Line Chart (Marks)</h3>
<canvas id="c1" width="300" height="300"></canvas>
</div>

<div class="box">
<h3>Bar Chart (Attendance %)</h3>
<canvas id="c2" width="300" height="300"></canvas>
</div>

<div class="box">
<h3>Pie Chart (Performance)</h3>
<canvas id="c3" width="300" height="300"></canvas>
</div>

</div>

<script>
let marks=[80,75,85,70,90];
let attendance=[90,85,88,80,95];
let performance=[3,1,1]; // Good, Avg, Poor

// LINE → Marks trend
let ctx1=c1.getContext("2d");
ctx1.strokeStyle="blue";
ctx1.beginPath();
marks.forEach((m,i)=>{
 let x=30+i*40,y=250-m*2;
 i==0?ctx1.moveTo(x,y):ctx1.lineTo(x,y);
});
ctx1.stroke();

// BAR → Attendance comparison
let ctx2=c2.getContext("2d");
ctx2.fillStyle="green";
attendance.forEach((a,i)=>{
 let x=30+i*40,y=250-a*2;
 ctx2.fillRect(x,y,20,a*2);
});

// PIE → Performance distribution
let ctx3=c3.getContext("2d");
let total=performance.reduce((a,b)=>a+b,0),start=0;
let colors=["green","orange","red"];

performance.forEach((v,i)=>{
 let slice=(v/total)*2*Math.PI;
 ctx3.beginPath();
 ctx3.moveTo(150,150);
 ctx3.arc(150,150,100,start,start+slice);
 ctx3.fillStyle=colors[i];
 ctx3.fill();
 start+=slice;
});
</script>

</body>
</html>
```
