<!DOCTYPE html>
<html>
<head>
    <title>Product Filter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Product Filter</h2>

<!-- Filter Buttons -->
<div class="filters">
    <button onclick="filterProducts('all')">All</button>
    <button onclick="filterProducts('electronics')">Electronics</button>
    <button onclick="filterProducts('clothing')">Clothing</button>
    <button onclick="filterProducts('shoes')">Shoes</button>
</div>

<!-- Products -->
<div class="products">

    <div class="item electronics">Laptop</div>
    <div class="item electronics">Mobile</div>
    <div class="item clothing">T-Shirt</div>
    <div class="item clothing">Jacket</div>
    <div class="item shoes">Sneakers</div>
    <div class="item shoes">Boots</div>

</div>

<script src="script.js"></script>
</body>
</html>
