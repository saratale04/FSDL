<!DOCTYPE html>
<html>
<head>
    <title>Simple Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-box">

    <h1>Simple Quiz</h1>

    <div class="question">
        <p>1. HTML stands for?</p>
        <label><input type="radio" name="q1" value="a"> Hyper Text Markup Language</label><br>
        <label><input type="radio" name="q1" value="b"> High Text Machine Language</label>
    </div>

    <div class="question">
        <p>2. CSS is used for?</p>
        <label><input type="radio" name="q2" value="a"> Styling</label><br>
        <label><input type="radio" name="q2" value="b"> Database</label>
    </div>

    <div class="question">
        <p>3. JavaScript is used for?</p>
        <label><input type="radio" name="q3" value="a"> Interactivity</label><br>
        <label><input type="radio" name="q3" value="b"> Hardware</label>
    </div>

    <button onclick="submitQuiz()">Submit</button>

</div>

<script src="script.js"></script>
</body>
</html>
