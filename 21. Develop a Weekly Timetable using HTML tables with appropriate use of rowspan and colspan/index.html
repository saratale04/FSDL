<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weekly Timetable</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h2>Weekly Timetable</h2>

<table>
    <tr>
        <th>Day / Time</th>
        <th>9-10</th>
        <th>10-11</th>
        <th>11-12</th>
        <th>12-1</th>
        <th>1-2</th>
        <th>2-3</th>
    </tr>

    <!-- Monday -->
    <tr>
        <th>Monday</th>
        <td>Math</td>
        <td>Physics</td>
        <td>Chemistry</td>
        <td rowspan="5" class="break">Lunch</td>
        <td>English</td>
        <td>Computer</td>
    </tr>

    <!-- Tuesday -->
    <tr>
        <th>Tuesday</th>
        <td colspan="2">Lab</td>
        <td>Math</td>
        <td>Physics</td>
        <td>Sports</td>
    </tr>

    <!-- Wednesday -->
    <tr>
        <th>Wednesday</th>
        <td>English</td>
        <td>Math</td>
        <td>Physics</td>
        <td colspan="2">Workshop</td>
    </tr>

    <!-- Thursday -->
    <tr>
        <th>Thursday</th>
        <td>Computer</td>
        <td colspan="2">Project</td>
        <td>Math</td>
        <td>English</td>
    </tr>

    <!-- Friday -->
    <tr>
        <th>Friday</th>
        <td>Physics</td>
        <td>Chemistry</td>
        <td>Math</td>
        <td colspan="2">Seminar</td>
    </tr>

</table>

</body>
</html>
