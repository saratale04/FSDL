
<!--
FILE: weather_js_labeled.html

HOW TO RUN:
1. Open in browser
2. No internet needed

CHARTS:
- Line Chart → Temperature trend
- Bar Chart → Rainfall comparison
- Pie Chart → Weather distribution
-->

<!DOCTYPE html>
<html>
<head>
<style>
.container { display:flex; justify-content:space-around; }
.box { text-align:center; }
canvas { border:1px solid #ccc; margin:10px; }
</style>
</head>

<body>
<h2 align="center">Weather Dashboard</h2>

<div class="container">

<div class="box">
<h3>Line Chart (Temperature °C)</h3>
<canvas id="c1" width="300" height="300"></canvas>
</div>

<div class="box">
<h3>Bar Chart (Rainfall mm)</h3>
<canvas id="c2" width="300" height="300"></canvas>
</div>

<div class="box">
<h3>Pie Chart (Weather Type)</h3>
<canvas id="c3" width="300" height="300"></canvas>
</div>

</div>

<script>
let temp=[30,32,31,29,28,27,26];
let rain=[5,10,8,2,0,1,3];
let weather=[3,2,2];

// LINE CHART → shows temperature trend
let ctx1=c1.getContext("2d");
ctx1.strokeStyle="blue";
ctx1.beginPath();
temp.forEach((t,i)=>{
 let x=30+i*40,y=250-t*5;
 i==0?ctx1.moveTo(x,y):ctx1.lineTo(x,y);
});
ctx1.stroke();

// BAR CHART → compares rainfall
let ctx2=c2.getContext("2d");
ctx2.fillStyle="green";
rain.forEach((r,i)=>{
 let x=30+i*40,y=250-r*10;
 ctx2.fillRect(x,y,20,r*10);
});

// PIE CHART → shows distribution
let ctx3=c3.getContext("2d");
let total=weather.reduce((a,b)=>a+b,0),start=0;
let colors=["orange","blue","gray"];

weather.forEach((v,i)=>{
 let slice=(v/total)*2*Math.PI;
 ctx3.beginPath();
 ctx3.moveTo(150,150);
 ctx3.arc(150,150,100,start,start+slice);
 ctx3.fillStyle=colors[i];
 ctx3.fill();
 start+=slice;
});
</script>
</body>
</html>
```
