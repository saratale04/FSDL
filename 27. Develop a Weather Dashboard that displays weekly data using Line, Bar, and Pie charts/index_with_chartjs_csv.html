FILE: weather_chart_labeled.html

HOW TO RUN:
1. Keep chart.js in same folder
2. Open file

-->

<!DOCTYPE html>
<html>
<head>
<style>
.container { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.box { background:white; padding:10px; text-align:center; }
</style>
</head>

<body>
<h2 align="center">Weather Dashboard</h2>

<div class="container">

<div class="box">
<h3>Line Chart (Temperature °C)</h3>
<canvas id="line"></canvas>
</div>

<div class="box">
<h3>Pie Chart (Weather Type)</h3>
<canvas id="pie"></canvas>
</div>

<div class="box" style="grid-column:span 2;">
<h3>Bar Chart (Rainfall mm)</h3>
<canvas id="bar"></canvas>
</div>

</div>

<script src="chart.js"></script>

<script>
let days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
let temp=[30,32,31,29,28,27,26];
let rain=[5,10,8,2,0,1,3];

// LINE → Temperature trend
new Chart(line,{
 type:"line",
 data:{
  labels:days,
  datasets:[{
   label:"Temperature",
   data:temp,
   borderColor:"blue",
   backgroundColor:"lightblue",
   fill:true
  }]
 }
});

// BAR → Rainfall comparison
new Chart(bar,{
 type:"bar",
 data:{
  labels:days,
  datasets:[{
   label:"Rainfall",
   data:rain,
   backgroundColor:"green"
  }]
 }
});

// PIE → Weather distribution
new Chart(pie,{
 type:"pie",
 data:{
  labels:["Sunny","Rainy","Cloudy"],
  datasets:[{
   data:[3,2,2],
   backgroundColor:["orange","blue","gray"]
  }]
 }
});
</script>

</body>
</html>
