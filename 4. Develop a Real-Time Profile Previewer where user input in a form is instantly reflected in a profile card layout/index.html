<!--
====================================================
REAL-TIME PROFILE PREVIEWER - HTML FILE
====================================================

This file:
1. Creates input form
2. Creates profile preview card
3. Links CSS and JS

====================================================
-->

<!DOCTYPE html>
<html>
<head>
    <title>Profile Previewer</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Profile Previewer</h1>

    <!-- Form Section -->
    <div class="form">

        <!-- Input for Name -->
        <input type="text" id="nameInput" placeholder="Enter Name">

        <!-- Input for Bio -->
        <input type="text" id="bioInput" placeholder="Enter Bio">

        <!-- Input for Image URL -->
        <input type="text" id="imgInput" placeholder="Enter Image URL">

    </div>

    <!-- Profile Card -->
    <div class="card">

        <!-- Image -->
        <img id="profileImg" src="https://via.placeholder.com/150">

        <!-- Name -->
        <h2 id="profileName">Your Name</h2>

        <!-- Bio -->
        <p id="profileBio">Your Bio</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
